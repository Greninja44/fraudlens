[project]
name = "fraudlens-api"
version = "0.1.0"
description = "FraudLens financial fraud investigation platform API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "networkx>=3.4",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10",
    "reportlab>=4.2",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
